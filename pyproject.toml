[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "googleads-invoice-glugglejug"
version = "0.0.0"
description = "Gmail → Google Ads invoice PDF → email automation (planned slices)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pypdf>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/googleads_invoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
