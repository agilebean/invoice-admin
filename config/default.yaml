dry_run: true
max_auto_amount_eur: 2000
classifier_min_confidence: 0.7

models:
  fast: openai/deepseek/deepseek-v4-flash
  smart: openai/deepseek/deepseek-v4-pro
  cheap: openai/minimax-m2.5
  # local model resolved via LM_STUDIO_MODEL env (default Qwen3.5 4B MLX)
  local: openai/local-model

notify:
  ntfy_topic: null
  pushover_user: null
  pushover_token: null

paths:
  state_dir: null
  invoices_root: null
  tracker_path: null
  log_path: null
  llm_calls_path: null
  # Human-labeled few-shot rows for classification (null = <repo>/config/classifier_examples.jsonl)
  classifier_examples: null
